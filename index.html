<title>Workflow Framework IA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#f5f6fa;
    --surface:#ffffff;
    --surface-raised:#ffffff;
    --ink:#10162b;
    --ink-soft:#48506b;
    --ink-muted:#767f98;
    --border:#dfe3ed;
    --border-soft:#ebeef5;
    --brand:#0b2471;
    --brand-ink:#0b2471;
    --improve:#ea580c;
    --improve-ink:#c2410c;
    --improve-border:#f6c9a6;
    --base-ink:#48506b;
    --shadow: 220 45% 12%;
    --node-ring:#f5f6fa;

    --accent-1:#0b2471;
    --accent-2:#0e8f6f;
    --accent-3:#b4790a;
    --accent-4:#6d28d9;
    --accent-5:#0e7c90;
    --accent-6:#ea580c;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e1a;
      --surface:#12182b;
      --surface-raised:#161e35;
      --ink:#eef1fb;
      --ink-soft:#b7bedb;
      --ink-muted:#7f88a8;
      --border:#262f4a;
      --border-soft:#1c2439;
      --brand:#5b7fe6;
      --brand-ink:#8fa6f0;
      --improve:#fb923c;
      --improve-ink:#fdba74;
      --improve-border:#5a3418;
      --base-ink:#b7bedb;
      --node-ring:#0a0e1a;

      --accent-1:#5b7fe6;
      --accent-2:#34c199;
      --accent-3:#e0a530;
      --accent-4:#a78bfa;
      --accent-5:#3fc1dc;
      --accent-6:#fb923c;
    }
  }

  :root[data-theme="dark"]{
    --bg:#0a0e1a;
    --surface:#12182b;
    --surface-raised:#161e35;
    --ink:#eef1fb;
    --ink-soft:#b7bedb;
    --ink-muted:#7f88a8;
    --border:#262f4a;
    --border-soft:#1c2439;
    --brand:#5b7fe6;
    --brand-ink:#8fa6f0;
    --improve:#fb923c;
    --improve-ink:#fdba74;
    --improve-border:#5a3418;
    --base-ink:#b7bedb;
    --node-ring:#0a0e1a;

    --accent-1:#5b7fe6;
    --accent-2:#34c199;
    --accent-3:#e0a530;
    --accent-4:#a78bfa;
    --accent-5:#3fc1dc;
    --accent-6:#fb923c;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:2.75rem 1.5rem 4rem;
  }

  h1,h2,h3,h4{ font-family:'Manrope', ui-sans-serif, sans-serif; margin:0; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  .header{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:1.25rem;
    padding-bottom:1.5rem;
    margin-bottom:2.25rem;
    border-bottom:1px solid var(--border);
  }
  .header-left .eyebrow{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brand-ink);
    margin-bottom:.55rem;
  }
  .header-left h1{
    font-size:clamp(1.7rem, 2.4vw, 2.35rem);
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.01em;
    line-height:1.12;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:.7rem;
  }
  .badge{
    padding:.5rem 1rem;
    border-radius:999px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .badge-new{
    background: color-mix(in srgb, var(--improve) 14%, var(--surface));
    color:var(--improve-ink);
    border:1px solid var(--improve-border);
  }
  .badge-progress{
    background: color-mix(in srgb, var(--brand) 10%, var(--surface));
    color:var(--brand-ink);
    border:1px solid color-mix(in srgb, var(--brand) 30%, var(--border));
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- stepper ---------- */
  .stepper{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    padding:0 1.25rem;
    margin:2.25rem 0 1.75rem;
  }
  .stepper-track{
    position:absolute;
    left:1.25rem; right:1.25rem; top:50%;
    height:2px;
    background:var(--border);
    transform:translateY(-50%);
    z-index:0;
  }
  .stepper-fill{
    position:absolute;
    left:1.25rem; top:50%;
    height:2px;
    background:var(--brand);
    transform:translateY(-50%);
    transition:width .5s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .step-node-btn{
    position:relative; z-index:2;
    background:none; border:none; padding:.35rem; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:.5rem;
  }
  .step-dot{
    width:1.75rem; height:1.75rem;
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem; font-weight:600;
    background:var(--surface);
    color:var(--ink-muted);
    border:2px solid var(--border);
    box-shadow:0 0 0 5px var(--node-ring);
    transition:all .25s ease;
  }
  .step-dot.is-past{ background:var(--brand); border-color:var(--brand); color:#fff; width:1.4rem; height:1.4rem; }
  .step-dot.is-active{ background:var(--brand); border-color:var(--brand); color:#fff; width:2.15rem; height:2.15rem; font-size:.8rem; box-shadow:0 0 0 5px var(--node-ring), 0 4px 14px -4px color-mix(in srgb, var(--brand) 60%, transparent); }
  .step-node-btn:hover .step-dot:not(.is-active):not(.is-past){ border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); }
  .step-label{
    font-size:.68rem;
    color:var(--ink-muted);
    max-width:6.5rem;
    text-align:center;
    line-height:1.2;
    display:none;
  }
  @media (min-width:760px){ .step-label{ display:block; } }

  /* ---------- card rail ---------- */
  .rail{
    display:flex;
    gap:1rem;
    overflow-x:auto;
    padding:.5rem .25rem 1.5rem;
    scroll-snap-type:x proximity;
  }
  .rail::-webkit-scrollbar{ height:6px; }
  .rail::-webkit-scrollbar-thumb{ background:var(--border); border-radius:999px; }

  .stage-card{
    flex:0 0 200px;
    scroll-snap-align:start;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    text-align:left;
    padding:0;
    overflow:hidden;
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    display:flex;
    flex-direction:column;
  }
  .stage-card:hover{ border-color: color-mix(in srgb, var(--card-accent) 40%, var(--border)); }
  .stage-card .topbar{ height:5px; background:var(--card-accent); opacity:.85; }
  .stage-card .body{
    padding:1.15rem 1.1rem 1.3rem;
    display:flex; flex-direction:column; align-items:flex-start; gap:.65rem;
  }
  .stage-card .idx{
    width:1.65rem; height:1.65rem;
    border-radius:999px;
    background: color-mix(in srgb, var(--card-accent) 12%, var(--surface));
    color:var(--card-accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem; font-weight:600;
  }
  .stage-card h3{ font-size:.95rem; font-weight:800; color:var(--ink); line-height:1.25; }
  .stage-card.active{
    border:1.5px solid var(--card-accent);
    box-shadow:0 16px 30px -16px color-mix(in srgb, var(--card-accent) 55%, transparent);
    transform:translateY(-3px);
  }
  .stage-card.active .idx{ background:var(--card-accent); color:#fff; }
  .stage-card.active h3{ color:var(--card-accent); }
  .stage-card:focus-visible, .step-node-btn:focus-visible{ outline:2px solid var(--brand); outline-offset:3px; border-radius:10px;}

  /* ---------- panel ---------- */
  .panel{
    background:var(--surface);
    border:1.5px solid var(--panel-accent, var(--border));
    border-radius:22px;
    box-shadow:0 22px 44px -30px color-mix(in srgb, var(--panel-accent, var(--ink)) 40%, transparent);
    overflow:hidden;
    transition:border-color .35s ease, box-shadow .35s ease;
  }
  .panel-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
  }
  @media (min-width:900px){
    .panel-grid{ grid-template-columns:1fr 1fr 1fr; }
    .col + .col{ border-left:1px solid var(--border-soft); }
  }
  .col{ padding:2rem 1.9rem; }
  .col-head{
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:1.4rem;
  }
  .col-head.base{ color:var(--ink-muted); }
  .col-head.mejoras{ color:var(--improve-ink); }
  .col-head.work{ color:var(--panel-accent, var(--brand-ink)); }

  .task-list{ display:flex; flex-direction:column; gap:.9rem; }
  .task{
    display:flex; align-items:flex-start; gap:.75rem;
    cursor:pointer; text-align:left; background:none; border:none; padding:0;
    width:100%;
  }
  .task-box{
    flex:0 0 auto;
    width:1.3rem; height:1.3rem;
    border-radius:6px;
    border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    margin-top:.1rem;
    transition:all .18s ease;
  }
  .task-box svg{ opacity:0; transform:scale(.6); transition:all .18s ease; }
  .task.done .task-box svg{ opacity:1; transform:scale(1); }
  .task span{ font-size:.92rem; line-height:1.45; transition:color .18s ease; }

  .task.base .task-box{ border-color:var(--border); }
  .task.base.done .task-box{ background:var(--base-ink); border-color:var(--base-ink); }
  .task.base span{ color:var(--ink); font-weight:500; }
  .task.base.done span{ color:var(--ink-muted); text-decoration:line-through; }

  .task.mejora .task-box{ border-color:var(--improve-border); }
  .task.mejora.done .task-box{ background:var(--improve); border-color:var(--improve); }
  .task.mejora span{ color:var(--improve-ink); font-weight:700; }
  .task.mejora.done span{ color: color-mix(in srgb, var(--improve-ink) 45%, var(--ink-muted)); text-decoration:line-through; }

  .task-box svg path{ stroke:#fff; }

  /* ---------- workspace ---------- */
  .work-placeholder{
    background: color-mix(in srgb, var(--panel-accent, var(--brand)) 8%, var(--surface));
    border:1px solid color-mix(in srgb, var(--panel-accent, var(--brand)) 28%, var(--border));
    border-radius:16px;
    padding:1.75rem;
    min-height:220px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:.9rem;
  }
  .work-placeholder svg{ color:var(--panel-accent, var(--brand)); opacity:.6; }
  .work-placeholder p{ margin:0; font-size:.86rem; line-height:1.5; color:var(--panel-accent, var(--brand-ink)); }
  .work-placeholder strong{ color:var(--ink); }

  .timer-card{
    background: color-mix(in srgb, var(--ink) 3%, var(--surface));
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.6rem 1.5rem;
    display:flex; flex-direction:column; align-items:center;
  }
  .timer-card h4{
    font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:.9rem;
  }
  .timer-display{
    font-size:2.9rem; font-weight:600; letter-spacing:-.02em;
    color:var(--ink); margin-bottom:1.4rem;
  }
  .timer-buttons{ display:flex; gap:.65rem; width:100%; }
  .timer-buttons button{
    flex:1; padding:.6rem 0; border-radius:10px; border:none;
    font-family:'Source Sans 3', sans-serif; font-weight:700; font-size:.86rem;
    cursor:pointer; transition:filter .15s ease, transform .1s ease;
  }
  .timer-buttons button:active{ transform:translateY(1px); }
  .btn-start{ background:var(--brand); color:#fff; }
  .btn-start.running{ background:#c2760a; }
  .btn-reset{ background:var(--border-soft); color:var(--ink-soft); }
  .timer-buttons button:hover{ filter:brightness(1.08); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<div class="wrap">

  <div class="header">
    <div class="header-left">
      <div class="eyebrow">Sprint de Diseño con IA · Bci</div>
      <h1>Workflow Base del Framework IA</h1>
    </div>
    <div class="header-right">
      <span class="badge badge-progress" id="progressBadge"></span>
      <span class="badge badge-new">Nuevos elementos incorporados</span>
    </div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="rail" id="rail"></div>

  <div class="panel" id="panel">
    <div class="panel-grid">
      <div class="col">
        <h4 class="col-head base">Actividades base</h4>
        <div class="task-list" id="baseList"></div>
      </div>
      <div class="col">
        <h4 class="col-head mejoras">Mejoras integradas</h4>
        <div class="task-list" id="mejorasList"></div>
      </div>
      <div class="col">
        <h4 class="col-head work">Espacio de trabajo</h4>
        <div id="workArea"></div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  var CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var stages = [
    { title:"Preparación Taller", short:"Preparación",
      base:[ {id:'1b1',text:'Coordinación e insumos.'}, {id:'1b2',text:'Problem Statement & Arquetipos.'} ],
      mejoras:[ {id:'1m1',text:'Brief formal de solicitud.'}, {id:'1m2',text:'Reunión Focal & DoR (Definition of Ready).'} ] },
    { title:"Reunión Inicial", short:"Kick Off",
      base:[ {id:'2b1',text:'Kick Off & contexto del desafío.'}, {id:'2b2',text:'Reglas de trabajo.'} ],
      mejoras:[ {id:'2m1',text:'Presentación que delimita el alcance.'}, {id:'2m2',text:'Agendamiento estricto a Medio Q (evita cierres).'} ] },
    { title:"Jornada 1", short:"Jornada 1",
      base:[ {id:'3b1',text:'Deep Research con IA.'}, {id:'3b2',text:'Wireframing conceptual.'} ],
      mejoras:[ {id:'3m1',text:'Kit de Prompts base listo para usar.'}, {id:'3m2',text:'Gema de apoyo metodológica (UXC / Framework).'}, {id:'3m3',text:'Arquetipos como guía flexible (no traba).'} ] },
    { title:"Semana Intermedia", short:"Iteración",
      base:[ {id:'4b1',text:'Iteración de maquetas.'}, {id:'4b2',text:'Validaciones en vivo.'} ],
      mejoras:[ {id:'4m1',text:'Revisiones agendadas de guía intermedia.'}, {id:'4m2',text:'Evaluación de opción "Jornada Única" (1 día).'} ] },
    { title:"Jornada 2", short:"Jornada 2",
      base:[ {id:'5b1',text:'Laboratorio UI Alta Fidelidad.'}, {id:'5b2',text:'Prototipado interactivo.'} ],
      mejoras:[ {id:'5m1',text:'Plantilla base oficial de presentación.'}, {id:'5m2',text:'Formato estandarizado para Demo (QR / GIF).'}, {id:'5m3',text:'Tiempo delimitado del Pitch.'} ] },
    { title:"Revisión & Feedback", short:"Feedback",
      base:[ {id:'6b1',text:'Pitch final & Retroalimentación.'} ],
      mejoras:[ {id:'6m1',text:'Feedback de solicitante (vale/negocio).'}, {id:'6m2',text:'Pauta de entrevistas de adopción IA.'}, {id:'6m3',text:'Tracking de valor a 1-2 meses post-sprint.'} ] }
  ];

  var TOTAL_TASKS = stages.reduce(function(n,s){ return n + s.base.length + s.mejoras.length; }, 0);
  var accentVars = ['--accent-1','--accent-2','--accent-3','--accent-4','--accent-5','--accent-6'];

  var state = { stage: 0, done: new Set() };
  var timer = { seconds: 7*60, running:false, interval:null };

  var stepperEl = document.getElementById('stepper');
  var railEl = document.getElementById('rail');
  var panelEl = document.getElementById('panel');
  var baseListEl = document.getElementById('baseList');
  var mejorasListEl = document.getElementById('mejorasList');
  var workAreaEl = document.getElementById('workArea');
  var progressBadge = document.getElementById('progressBadge');

  function accentFor(idx){ return 'var(' + accentVars[idx % accentVars.length] + ')'; }

  function setStage(idx){
    if (idx === state.stage) return;
    state.stage = idx;
    if (idx !== 4) stopTimer();
    renderStepper();
    renderRail();
    renderPanel();
  }

  function toggleTask(id, btn){
    if (state.done.has(id)) state.done.delete(id); else state.done.add(id);
    btn.classList.toggle('done');
    updateProgressBadge();
  }

  function updateProgressBadge(){
    progressBadge.textContent = state.done.size + ' / ' + TOTAL_TASKS + ' completadas';
  }

  function renderStepper(){
    var pct = (state.stage / (stages.length - 1)) * 100;
    var html = '<div class="stepper-track"></div><div class="stepper-fill" style="width:' + pct + '%"></div>';
    stages.forEach(function(s, i){
      var cls = 'step-dot' + (i === state.stage ? ' is-active' : (i < state.stage ? ' is-past' : ''));
      html += '<button class="step-node-btn" data-idx="' + i + '" aria-label="Ir a etapa ' + (i+1) + ': ' + s.title + '">' +
        '<span class="' + cls + '">' + (i+1) + '</span>' +
        '<span class="step-label">' + s.short + '</span>' +
        '</button>';
    });
    stepperEl.innerHTML = html;
    stepperEl.querySelectorAll('.step-node-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ setStage(parseInt(btn.dataset.idx, 10)); });
    });
  }

  function renderRail(){
    var html = '';
    stages.forEach(function(s, i){
      var active = i === state.stage;
      html += '<button class="stage-card' + (active ? ' active' : '') + '" style="--card-accent:' + accentFor(i) + '" data-idx="' + i + '">' +
        (!active ? '<div class="topbar"></div>' : '') +
        '<div class="body">' +
          '<span class="idx">' + (i+1) + '</span>' +
          '<h3>' + s.title + '</h3>' +
        '</div>' +
      '</button>';
    });
    railEl.innerHTML = html;
    railEl.querySelectorAll('.stage-card').forEach(function(card){
      card.addEventListener('click', function(){
        var idx = parseInt(card.dataset.idx, 10);
        setStage(idx);
        card.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
      });
    });
  }

  function taskRow(task, kind){
    var isDone = state.done.has(task.id);
    return '<button class="task ' + kind + (isDone ? ' done' : '') + '" data-id="' + task.id + '">' +
      '<span class="task-box">' + CHECK_SVG + '</span>' +
      '<span>' + task.text + '</span>' +
    '</button>';
  }

  function renderPanel(){
    var s = stages[state.stage];
    var accent = accentFor(state.stage);
    panelEl.style.setProperty('--panel-accent', accent);

    baseListEl.innerHTML = s.base.map(function(t){ return taskRow(t, 'base'); }).join('');
    mejorasListEl.innerHTML = s.mejoras.map(function(t){ return taskRow(t, 'mejora'); }).join('');

    panelEl.querySelectorAll('.task').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleTask(btn.dataset.id, btn); });
    });

    stopTimer();
    if (state.stage === 4){
      timer.seconds = 7*60;
      workAreaEl.innerHTML =
        '<div class="timer-card">' +
          '<h4>Timer del Pitch Oficial</h4>' +
          '<div class="timer-display mono" id="timerDisplay">07:00</div>' +
          '<div class="timer-buttons">' +
            '<button class="btn-start" id="timerToggle">Iniciar</button>' +
            '<button class="btn-reset" id="timerReset">Reiniciar</button>' +
          '</div>' +
        '</div>';
      document.getElementById('timerToggle').addEventListener('click', toggleTimer);
      document.getElementById('timerReset').addEventListener('click', resetTimer);
      renderTimerDisplay();
    } else {
      workAreaEl.innerHTML =
        '<div class="work-placeholder">' +
          '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 2.5c2.8 1.6 4.5 4.6 4.5 8 0 2-1 4.3-2.2 6l-2.3 3-2.3-3C8.5 14.8 7.5 12.5 7.5 10.5c0-3.4 1.7-6.4 4.5-8z"/>' +
            '<circle cx="12" cy="10.5" r="1.8"/>' +
            '<path d="M8 16.5c-1.6.6-2.5 1.8-3 3.5 1.8-.3 3.1-1 4-2.3"/>' +
            '<path d="M16 16.5c1.6.6 2.5 1.8 3 3.5-1.8-.3-3.1-1-4-2.3"/>' +
          '</svg>' +
          '<p>Marca las actividades base y las mejoras integradas de <strong>"' + s.title + '"</strong> a medida que avanzas.</p>' +
        '</div>';
    }
  }

  function renderTimerDisplay(){
    var el = document.getElementById('timerDisplay');
    if (!el) return;
    var m = Math.floor(timer.seconds / 60);
    var sec = timer.seconds % 60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    var toggleBtn = document.getElementById('timerToggle');
    if (toggleBtn){
      toggleBtn.textContent = timer.running ? 'Pausar' : 'Iniciar';
      toggleBtn.classList.toggle('running', timer.running);
    }
  }

  function toggleTimer(){
    timer.running = !timer.running;
    if (timer.running){
      timer.interval = setInterval(function(){
        if (timer.seconds > 0){
          timer.seconds -= 1;
          renderTimerDisplay();
        }
        if (timer.seconds === 0) stopTimer();
      }, 1000);
    } else {
      clearInterval(timer.interval);
    }
    renderTimerDisplay();
  }

  function resetTimer(){
    stopTimer();
    timer.seconds = 7*60;
    renderTimerDisplay();
  }

  function stopTimer(){
    timer.running = false;
    clearInterval(timer.interval);
  }

  renderStepper();
  renderRail();
  renderPanel();
  updateProgressBadge();
})();
</script>
